<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#b4552f; }
  ::selection{ background:#f3ead9; color:#a34a28; }
  a{ color:#f7efdf; } a:hover{ color:#2e2119; }
  @keyframes markIn{ from{ opacity:0; transform:scale(.4);} to{ opacity:1; transform:scale(1);} }
  .dust{ position:absolute; border-radius:50%; pointer-events:none; }
  .navl{ transition:opacity .25s ease; opacity:.75; } .navl:hover{ opacity:1; }

  @media (max-width:900px){
    .rgrid, .rgrid3, .pieces{ grid-template-columns:1fr !important; }
    .cols3{ columns:1 !important; }
    .wrow{ grid-template-columns:1fr !important; }
    nav{ flex-wrap:wrap !important; gap:14px !important; }
    .navlinks{ flex-wrap:wrap !important; gap:16px 22px !important; }
    .padcard{ padding:44px 28px !important; }
    .irow{ flex-wrap:wrap !important; }
    .irow .icard{ flex:1 1 220px !important; }
  }
</style>
</helmet>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  fxRef = React.createRef();
  cballRef = React.createRef();

  dust(panel, x, y, n, dirx, diry){
    const kx=-(dirx||0)*6, ky=-(diry||0)*6;
    for(let i=0;i<(n||3);i++){
      const d=document.createElement('div'); d.className='dust';
      const s=5+Math.random()*14, dur=.55+Math.random()*.5;
      const hue=Math.random()<.4?'rgba(232,166,124,.38)':'rgba(214,120,76,.45)';
      d.style.cssText+=`left:${x-s/2+(Math.random()-.5)*10}px;top:${y-s/2+(Math.random()-.5)*6}px;width:${s}px;height:${s}px;opacity:${.3+Math.random()*.25};background:radial-gradient(circle at ${30+Math.random()*40}% ${30+Math.random()*40}%, ${hue}, transparent 68%);transition:transform ${dur}s cubic-bezier(.2,.6,.3,1), opacity ${dur}s ease-out;`;
      panel.appendChild(d);
      requestAnimationFrame(()=>{
        d.style.transform=`translate(${kx+(Math.random()-.5)*60}px,${ky-14-Math.random()*38}px) scale(${1.8+Math.random()*1.6}) rotate(${(Math.random()-.5)*90}deg)`;
        d.style.opacity='0';
      });
      setTimeout(()=>d.remove(),dur*1000+80);
    }
    for(let i=0;i<Math.ceil((n||3)/2);i++){
      const g=document.createElement('div'); g.className='dust';
      const s=2+Math.random()*3, dur=.45+Math.random()*.3;
      g.style.cssText+=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:.9;background:#7a3014;transition:transform ${dur}s cubic-bezier(.2,-0.3,.7,1), opacity ${dur}s ease-in;`;
      panel.appendChild(g);
      requestAnimationFrame(()=>{
        g.style.transform=`translate(${kx*1.4+(Math.random()-.5)*70}px,${8+Math.random()*14}px)`;
        g.style.opacity='0';
      });
      setTimeout(()=>g.remove(),dur*1000+80);
    }
  }

  componentDidMount(){
    const s={x:innerWidth/2,y:innerHeight/2,tx:innerWidth/2,ty:innerHeight/2,px:0,py:0,seen:false};
    this._onMove=e=>{ s.tx=e.clientX; s.ty=e.clientY; if(!s.seen){ s.seen=true; s.x=s.tx; s.y=s.ty; } };
    window.addEventListener('pointermove',this._onMove,{passive:true});
    const tick=()=>{
      const b=this.cballRef.current, fx=this.fxRef.current;
      if(b&&fx&&s.seen){
        s.x+=(s.tx-s.x)*.09; s.y+=(s.ty-s.y)*.09;
        const vx=s.x-s.px, vy=s.y-s.py, sp=Math.hypot(vx,vy);
        if(sp>5) this.dust(fx, s.x, s.y+10, sp>12?3:1, vx/sp*Math.min(sp,14), vy/sp*Math.min(sp,14));
        s.px=s.x; s.py=s.y;
        b.style.opacity='1';
        const sq=Math.min(sp/28,.2), ang=Math.atan2(vy,vx)*180/Math.PI;
        b.style.transform=`translate(${s.x-14}px,${s.y-14}px) rotate(${ang}deg) scale(${1+sq},${1-sq}) rotate(${-ang}deg)`;
        if(b.firstElementChild) b.firstElementChild.style.transform=`rotate(${s.x*2}deg)`;
        if(sp>9 && navigator.vibrate && Date.now()-(this._hv||0)>90){ this._hv=Date.now(); try{ navigator.vibrate(6); }catch(e){} }
      }
      this._raf=requestAnimationFrame(tick);
    };
    this._raf=requestAnimationFrame(tick);
  }
  componentWillUnmount(){
    window.removeEventListener('pointermove',this._onMove);
    cancelAnimationFrame(this._raf);
  }

  renderVals(){
    return {
      root:this.rootRef, fx:this.fxRef, cball:this.cballRef,
      paras: [
        { text:'\u201cHow did we become so arrogant?\u201d, she deliberated with herself over a cup of fresh, warm brew. It was 4:12 in the morning and the breaking of the day was announced by the distant chirping of the birds. She sat down with that cup of coffee and thought about this line that remained with her long after she had watched the movie.' },
        { text:'\u2018Pain demands to be felt\u2019, what a profound thought. On the first glance, you may not notice the glaring evidence as it is obscured by the simplicity. But stop and read it again.' },
        { text:'When was the last time you allowed yourself to feel your emotions? Did you allow yourself the luxury of feeding your heart with the emotions it desires the most? Did you let pain move through you and touch every bone and muscle in your body?' },
        { text:'Or did you, shun it away. Hiding from it thinking time will make it go away and bury it deep in a dark, dingy and forbidden corner and keep your body from going there? Sure alcohol and cigarettes helped you sleep that night and on many other nights. But why did you take that away from you? Why wouldn\u2019t you set yourself free from these uncanny inhibitions, knowing only too well that it will all come back to you one day, bigger and worse.' },
        { text:'How did we lose sight of the one thing that manifests our soul? To become so arrogant that we began to think of ourselves as the epitome of chaos and suffering and love. Why did we let ourselves not become more than this box that we call personality, when in fact, it is just a desperate collection of thoughts and ideas that aren\u2019t even ours?' },
        { text:'She called up her best friend and said \u201cYou can be infinite. You\u2019re more than what you are feeling now. You\u2019re more than your pain and happiness. You are all of that and much more. You measure time in eras; that of Shakespeare and Beethoven and Pink Floyd and not by the 24-hour format. You see water as rain and streams and don\u2019t hide yourself under an umbrella only to take a shower every day. You see colors as hues of the sky and ocean as you stare into the vast infiniteness. You see compassion when you feed the strays and sneak them into your house. You see love beyond romance, in photosynthesis in plants between the green leaves and water. You see sorrow in tears and you let it crumple you whole on most nights, letting it pass through you, unopposed. You don\u2019t attach these stupid weights and values to these fleeting emotions and assign and feed them away into the growing array in your brain. You see the days in nights and the nights in days. You see humor in the sunrise and resilience in sunset, empowering yourself to be amazed by them every day. You see pain in the eyes of the kids starving on the streets as your heart wrenches at your inability to help them. You see education in our silly conversations on the rooftop over that brownie. You find strength even when the memories of that addiction that brought you an irreversible loss, ambush you.You see life in death. You build maps from the wrinkles on faces. You built a home even as your family fell apart. You seek the truth behind the lies. You find warmth in blue. You\u2019re the apostrophe and the period. You find geometry as you gaze at the constellations. You have toiled through the longest roads with equanimity, on foot. Giving comes naturally to you while taking, nearly not.' },
        { text:'You are infinite.' },
        { text:'Unprecedented and daunting.' },
        { text:'Fearless, vulnerable yet fragile.\u201d' },
      ],
      marks: [
        { x:'12%', y:'560px', w:52, h:34, rot:-18 },
        { x:'80%', y:'1200px', w:44, h:30, rot:24 },
      ],
    };
  }
}
</script>
